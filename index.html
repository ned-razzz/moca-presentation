<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation Layout</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #151a21;
      --panel-2: #1d242d;
      --ink: #f5f7fb;
      --muted: #b8c0cc;
      --line: rgba(255, 255, 255, 0.14);
      --accent: #f2b955;
      --cyan: #68d3e8;
      --rose: #f07d8d;
      --green: #79d38a;
      --shadow: rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, -apple-system, sans-serif;
    }

    body {
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .deck {
      height: 100dvh;
      width: 100vw;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 22%, rgba(104, 211, 232, 0.12), transparent 32%),
        linear-gradient(135deg, #0d1117 0%, #121720 48%, #17120d 100%);
    }

    .slides {
      height: 100%;
      display: flex;
      transform: translateX(calc(var(--index, 0) * -100vw));
      transition: transform 420ms cubic-bezier(.22, .85, .2, 1);
    }

    .slide {
      flex: 0 0 100vw;
      height: 100dvh;
      padding: clamp(28px, 4vw, 72px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(20px, 3vw, 36px);
      position: relative;
    }

    .slide::after {
      content: attr(data-kicker);
      position: absolute;
      right: clamp(24px, 4vw, 64px);
      top: clamp(18px, 3vw, 42px);
      color: rgba(255, 255, 255, 0.36);
      font-size: clamp(12px, 1.2vw, 16px);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .hero {
      grid-template-rows: 1fr auto;
      padding: 0;
      overflow: hidden;
    }

    .hero .media-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.56) saturate(1.12);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(5, 7, 10, .86), rgba(5, 7, 10, .38) 58%, rgba(5, 7, 10, .72));
      z-index: 1;
    }

    .hero-content {
      z-index: 2;
      align-self: center;
      max-width: 980px;
      margin-left: clamp(32px, 7vw, 110px);
      padding-right: 28px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: clamp(14px, 1.35vw, 20px);
      font-weight: 700;
      margin: 0 0 16px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(58px, 10vw, 148px);
      line-height: .92;
      letter-spacing: 0;
      max-width: 8ch;
    }

    h2 {
      font-size: clamp(34px, 5.8vw, 82px);
      line-height: 1.02;
      letter-spacing: 0;
      max-width: 15ch;
    }

    h3 {
      font-size: clamp(20px, 2vw, 32px);
      line-height: 1.18;
    }

    .lead {
      margin-top: 24px;
      color: var(--muted);
      font-size: clamp(18px, 2.1vw, 30px);
      line-height: 1.48;
      max-width: 880px;
      word-break: keep-all;
    }

    .meta-row {
      z-index: 2;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin: 0 clamp(32px, 7vw, 110px) clamp(76px, 8vw, 112px);
      color: rgba(255,255,255,.78);
      font-size: clamp(13px, 1.2vw, 17px);
    }

    .header {
      display: grid;
      gap: 12px;
      max-width: 1180px;
      z-index: 2;
    }

    .section-mark {
      color: var(--accent);
      font-weight: 800;
      font-size: clamp(13px, 1.2vw, 17px);
    }

    .content {
      min-height: 0;
      display: grid;
      gap: clamp(18px, 2.3vw, 30px);
      align-items: center;
      z-index: 2;
    }

    .two-col {
      grid-template-columns: minmax(0, 1fr) minmax(340px, .9fr);
    }

    .three-col {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
    }

    .split-wide {
      grid-template-columns: minmax(0, .88fr) minmax(420px, 1.12fr);
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .card,
    .metric,
    .media-frame,
    .timeline-step {
      background: rgba(21, 26, 33, .82);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 40px var(--shadow);
    }

    .card {
      padding: clamp(18px, 2vw, 28px);
      display: grid;
      gap: 12px;
      min-height: 0;
    }

    .card p,
    li {
      color: var(--muted);
      font-size: clamp(16px, 1.45vw, 22px);
      line-height: 1.52;
      word-break: keep-all;
    }

    .card strong,
    li strong {
      color: var(--ink);
    }

    ul {
      margin: 0;
      padding-left: 1.15em;
    }

    .media-frame {
      overflow: hidden;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10141a;
    }

    .media-frame img {
      width: 100%;
      height: 100%;
      max-height: calc(100dvh - 230px);
      object-fit: cover;
      display: block;
    }

    .media-frame.contain img {
      object-fit: contain;
      padding: 10px;
    }

    .badge-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .06);
      font-size: clamp(12px, 1vw, 15px);
      white-space: nowrap;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .timeline-step {
      padding: 22px;
      min-height: 168px;
      display: grid;
      gap: 12px;
      align-content: start;
      border-top: 5px solid var(--accent);
    }

    .timeline-step:nth-child(2) { border-top-color: var(--cyan); }
    .timeline-step:nth-child(3) { border-top-color: var(--rose); }
    .timeline-step:nth-child(4) { border-top-color: var(--green); }

    .num {
      color: var(--accent);
      font-weight: 900;
      font-size: 15px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .metric {
      padding: 22px;
      display: grid;
      gap: 8px;
    }

    .metric b {
      font-size: clamp(26px, 3.2vw, 46px);
      line-height: 1;
      color: var(--accent);
    }

    .metric span {
      color: var(--muted);
      font-size: clamp(13px, 1.15vw, 17px);
      line-height: 1.45;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      height: 100%;
      min-height: 0;
    }

    .image-grid img {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #111820;
    }

    .image-grid.contain img {
      object-fit: contain;
      padding: 8px;
      background: white;
    }

    .diagram-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .diagram-row img {
      width: 100%;
      aspect-ratio: 1.6;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 8px;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
      padding: 8px;
      border-radius: 999px;
      background: rgba(8, 10, 14, .72);
      border: 1px solid rgba(255, 255, 255, .15);
      backdrop-filter: blur(12px);
    }

    .controls button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.08);
      color: var(--ink);
      cursor: pointer;
    }

    .controls button:hover {
      border-color: var(--accent);
    }

    .counter {
      min-width: 68px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(255,255,255,.1);
      z-index: 21;
    }

    .progress span {
      display: block;
      height: 100%;
      width: calc(var(--progress, 0) * 100%);
      background: linear-gradient(90deg, var(--accent), var(--cyan));
      transition: width 260ms ease;
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .deck {
        height: auto;
        min-height: 100dvh;
      }

      .slides {
        display: block;
        transform: none !important;
      }

      .slide {
        min-height: 100dvh;
        height: auto;
      }

      .hero {
        min-height: 100dvh;
      }

      .two-col,
      .three-col,
      .split-wide,
      .flow,
      .metrics,
      .diagram-row {
        grid-template-columns: 1fr;
      }

      .media-frame img {
        max-height: none;
      }

      .controls,
      .progress {
        display: none;
      }
    }

    @media print {
      body {
        overflow: visible;
        background: white;
      }

      .deck,
      .slides,
      .slide {
        display: block;
        width: 100%;
        height: auto;
        transform: none !important;
        background: #0d1117;
      }

      .slide {
        page-break-after: always;
        min-height: 100vh;
      }

      .controls,
      .progress {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="deck" aria-label="HTML presentation layout">
    <div class="slides" id="slides">
      <section class="slide hero" data-kicker="Cover">
        <div class="hero-content">
          <p class="eyebrow">첫 슬라이드</p>
          <h1>제목</h1>
          <p class="lead">부제 또는 발표 정보를 입력합니다.</p>
        </div>
        <div class="meta-row">
          <span>발표자</span>
          <span>날짜</span>
        </div>
      </section>

      <section class="slide" data-kicker="Agenda">
        <div class="header">
          <p class="section-mark">01 / 목차</p>
          <h2>목차</h2>
        </div>
        <div class="content">
          <div class="flow">
            <div class="timeline-step">
              <span class="num">01</span>
              <h3>첫 번째 항목</h3>
              <p>내용을 입력합니다.</p>
            </div>
            <div class="timeline-step">
              <span class="num">02</span>
              <h3>두 번째 항목</h3>
              <p>내용을 입력합니다.</p>
            </div>
            <div class="timeline-step">
              <span class="num">03</span>
              <h3>세 번째 항목</h3>
              <p>내용을 입력합니다.</p>
            </div>
          </div>
        </div>
      </section>

      <section class="slide" data-kicker="Example">
        <div class="header">
          <p class="section-mark">02 / 내용 예시</p>
          <h2>내용 예시 슬라이드</h2>
        </div>
        <div class="content two-col">
          <div class="stack">
            <div class="card">
              <h3>핵심 메시지</h3>
              <p>본문 내용을 입력합니다.</p>
            </div>
            <div class="card">
              <h3>보조 설명</h3>
              <p>필요한 설명이나 근거를 입력합니다.</p>
            </div>
          </div>
          <div class="media-frame contain">
            <p>이미지 또는 도표 영역</p>
          </div>
        </div>
      </section>
    </div>

    <nav class="controls" aria-label="슬라이드 이동">
      <button type="button" id="prev" aria-label="이전 슬라이드">‹</button>
      <span class="counter" id="counter">1 / 3</span>
      <button type="button" id="next" aria-label="다음 슬라이드">›</button>
    </nav>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
  </main>

  <script>
    const root = document.documentElement;
    const slides = Array.from(document.querySelectorAll(".slide"));
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    let index = 0;

    function setSlide(nextIndex) {
      index = Math.max(0, Math.min(slides.length - 1, nextIndex));
      root.style.setProperty("--index", index);
      root.style.setProperty("--progress", slides.length <= 1 ? 1 : index / (slides.length - 1));
      counter.textContent = `${index + 1} / ${slides.length}`;
      prev.disabled = index === 0;
      next.disabled = index === slides.length - 1;
      history.replaceState(null, "", `#${index + 1}`);
    }

    prev.addEventListener("click", () => setSlide(index - 1));
    next.addEventListener("click", () => setSlide(index + 1));

    window.addEventListener("keydown", (event) => {
      if (["ArrowRight", "PageDown", " "].includes(event.key)) {
        event.preventDefault();
        setSlide(index + 1);
      }
      if (["ArrowLeft", "PageUp"].includes(event.key)) {
        event.preventDefault();
        setSlide(index - 1);
      }
      if (event.key === "Home") setSlide(0);
      if (event.key === "End") setSlide(slides.length - 1);
    });

    const fromHash = Number.parseInt(location.hash.replace("#", ""), 10);
    setSlide(Number.isFinite(fromHash) ? fromHash - 1 : 0);
  </script>
</body>
</html>
